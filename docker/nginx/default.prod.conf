# ============================================================
# Config nginx PRODUCTION — HTTPS + headers de sécurité
# ============================================================
# Remplacer "votre-domaine.fr" par le vrai nom de domaine avant déploiement.
#
# MISE EN ROUTE (ordre important — bootstrap Let's Encrypt) :
#   1. Démarrer d'abord avec docker/nginx/default.conf (HTTP seul, déjà en
#      place) pour que le domaine réponde sur le port 80.
#   2. Obtenir le certificat :
#        docker run --rm -v ./public:/var/www/html/public \
#          -v ./docker/nginx/ssl:/etc/letsencrypt \
#          certbot/certbot certonly --webroot -w /var/www/html/public \
#          -d votre-domaine.fr
#      (ou certbot standalone sur le VPS si nginx n'est pas encore lancé)
#   3. Copier/lier fullchain.pem et privkey.pem dans docker/nginx/ssl/
#      (chemins attendus par ce fichier ci-dessous).
#   4. Basculer le volume nginx de docker-compose.prod.yml vers ce fichier
#      (default.prod.conf) et redémarrer : docker compose -f docker-compose.prod.yml up -d
#   5. Renouvellement : relancer l'étape 2 tous les ~60 jours (cron),
#      puis `docker compose -f docker-compose.prod.yml exec nginx nginx -s reload`.
# ============================================================

server {
    listen 80;
    server_name votre-domaine.fr;

    # Permet la validation ACME (renouvellement Let's Encrypt) en HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/html/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name votre-domaine.fr;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Headers de sécurité (la CSP avec nonce est ajoutée côté PHP, voir public/index.php)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    root /var/www/html/public;
    index index.php;

    access_log /var/log/nginx/vg_access.log;
    error_log /var/log/nginx/vg_error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\. {
        deny all;
    }

    location ~ \.(env|sql|md|json|lock)$ {
        deny all;
    }

    # Cache pour les assets statiques
    # (add_header n'est pas hérité du bloc server dès qu'une location en définit
    # un elle-même : on répète donc les headers de sécurité ici)
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|css|js|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
