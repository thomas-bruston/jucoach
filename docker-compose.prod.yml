services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: jcs_app
    restart: always
    volumes:
      - .:/var/www/html
      - jcs_galerie_data:/var/www/html/public/images/galerie
    depends_on:
      - mysql
    networks:
      - jcs_network
    environment:
      - APP_ENV=production
    env_file:
      - .env

  nginx:
    image: nginx:alpine
    container_name: jcs_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - jcs_network

  mysql:
    image: mysql:8.0
    container_name: jcs_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - jcs_mysql_data:/var/lib/mysql
      - ./sql/create.sql:/docker-entrypoint-initdb.d/01_create.sql
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    networks:
      - jcs_network
    # Pas de port exposé en prod

volumes:
  jcs_mysql_data:
  jcs_galerie_data:

networks:
  jcs_network:
    driver: bridge
